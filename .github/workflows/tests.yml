name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # ubuntu-24.04: на ubuntu-latest (26.04) setup-python больше не даёт 3.9
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка пакета с тестовой зависимостью
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Тесты (ядро, сходимость, реальная система, валидационный слой)
        run: python -m pytest tests/ -v

      - name: Примеры (в том числе на реальной системе)
        run: |
          python examples/simple_bowl.py
          python examples/surrender.py
          python examples/driven_oscillator.py
