[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homeo-controller"
version = "0.1.0"
description = "Гомеостатический контроллер на инвариантах: Adam-релаксация с термальным шумом, порт ядра с C++ CIDHC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kostyk348" }]
keywords = ["control", "homeostasis", "invariants", "policy", "agent", "reinforcement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["homeo"]
